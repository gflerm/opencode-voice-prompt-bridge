# OpenCode Voice Prompt Bridge - example configuration
# Copy to config.toml and adjust. config.toml is gitignored.

[hotkey]
# pynput key name for push-to-talk (GlobalHotkey listens for press/release)
key = "caps_lock"
# ignore taps shorter than this many milliseconds (accidental press)
min_duration_ms = 200

[audio]
# Input device index; null = system default. Run scripts/check_env.py to list.
device = 1
sample_rate = 16000
channels = 1
block_ms = 30
# Software multiplier applied after capture (clipped to [-1, 1]).
# Keep 1.0 unless transcripts come back empty; lower if peak nears 1.0.
gain = 1.0

[whisper]
# Model profiles (benchmarked 2026-08-28 on RTX 5070, CUDA float16):
#   fast     = small.en          (0.13s median, 74% word score)
#   balanced = medium.en         (0.22s median, 77%, steadiest on technical terms)
#   accuracy = distil-large-v3   (0.16s median, 77%, best on "dot" identifiers)
model = "medium.en"
# "auto" | "cuda" | "cpu"
device = "auto"
# "auto" | "float16" | "bfloat16" | "int8_float16" | "int8" | "float32"
compute_type = "auto"
language = "en"

[benchmark]
# Directory of WAV files used by scripts/benchmark_whisper.py
corpus_dir = "data/corpus"

[opencode]
# How the final prompt reaches OpenCode (FR-04).
#   "run"  = spawn `opencode run <prompt>` in a new console (one-shot)
#   "attach" = `opencode run --attach <server> <prompt>` (needs attach_server)
#   "tui"  = paste into the window that had focus when recording started
#            (lands in your live OpenCode TUI session; works with any app)
command = "opencode"
mode = "tui"
attach_server = ""
show_console = true
# Keep the spawned console open after `opencode run` finishes (cmd /k)
# so the reply stays readable. false = window closes when done.
# (only applies to run/attach modes)
keep_open = true
# Optional working directory for the spawned process; empty = inherit.
working_dir = ""
# Opt-in only (spec section 18): skip the review window and send each
# dictation as soon as the key is released. If the send fails, the
# review window opens with the text so nothing is lost.
direct_send = false
# TUI mode delivery: auto_enter true submits right after the text lands;
# false leaves it in the prompt for you to review and press Enter.
auto_enter = true
# "paste" = clipboard paste (fast; TUI may show a paste chip).
# "type"  = types the text keystroke-by-keystroke so it appears as
# normal editable inline text (clipboard untouched).
input_method = "paste"
# Opt-in only (spec section 18): skip the review window and send each
# dictation as soon as the key is released. If the send fails, the
# review window opens with the text so nothing is lost.
direct_send = false

[ui]
# Where the review window docks: bottom_right | bottom_left | top_right | top_left | center
anchor = "bottom_right"
margin = 48

[adaptation]
# SQLite database for glossary terms, learned corrections and sessions.
db_path = "data/adaptation.db"
# Emergency bypass: tap this key to skip learned corrections once.
bypass_hotkey = "f9"
# Local telemetry (timestamp, latency, model, accepted - no prompt text).
record_sessions = true
# How many glossary terms are injected as Whisper initial_prompt context.
initial_prompt_terms = 20
